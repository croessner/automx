services:
  automx:
    build:
      context: .
      args:
        PYTHON_IMAGE: python:3.14.7-slim-trixie
        VERSION: 3.0.0-beta.1
    image: automx:3.0.0-beta.1
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./contrib/e2e/automx.conf:/etc/automx/automx.conf:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
