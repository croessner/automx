[automx]
provider = example.test
domains = example.test
autodiscover_v2 = yes

[DEFAULT]
account_name = Example Provider
account_name_short = Example
help_url = https://support.example.test/mail

[global]
backend = static

imap = yes
imap_server = imap.example.test
imap_port = 993
imap_encryption = ssl
imap_auth = oauth2, plaintext

pop = yes
pop_server = pop.example.test
pop_port = 995
pop_encryption = ssl
pop_auth = plaintext

smtp = yes
smtp_server = smtp.example.test
smtp_port = 465
smtp_encryption = ssl
smtp_auth = oauth2, plaintext
smtp_default = yes

managesieve = yes
managesieve_server = sieve.example.test
managesieve_port = 4190
managesieve_encryption = starttls
managesieve_auth = plaintext

jmap = yes
jmap_url = https://jmap.example.test/session
jmap_auth = oauth2

caldav = yes
caldav_url = https://sync.example.test/calendar/
caldav_auth = oauth2

carddav = yes
carddav_url = https://sync.example.test/contacts/
carddav_auth = oauth2

webdav = yes
webdav_url = https://files.example.test/dav/
webdav_auth = oauth2

ews = yes
ews_url = https://mail.example.test/EWS/Exchange.asmx
ews_auth = oauth2

activesync = yes
activesync_url = https://mail.example.test/Microsoft-Server-ActiveSync
activesync_auth = oauth2

actions = yes
actions_url = https://mail.example.test/actions
actions_server_location = EUR

oauth_issuer = https://identity.example.test/
oauth_auth_url = https://identity.example.test/authorize
oauth_token_url = https://identity.example.test/token
oauth_scope = openid offline_access urn:ietf:params:oauth:scope:mail
