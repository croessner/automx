services:
  dns:
    image: coredns/coredns:1.14.6@sha256:900f9c109f7a33545d3c811516e8376df9019147b750f5ce3e254468769176ea
    command:
      - -conf
      - /etc/coredns/Corefile
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    # The upstream binary carries this file capability; retaining only that
    # bounding capability is required even though the fixture binds port 1053.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
      - ./dns:/zones:ro
    # The upstream image's version-only healthcheck does not prove that the
    # fixture serves its zones. The automx healthcheck below performs a real
    # query and gates the entire stack instead.
    healthcheck:
      disable: true
  automx:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: python:3.14.7-slim-trixie
        VERSION: 3.0.0-beta.3
    image: automx:e2e
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./automx.conf:/etc/automx/automx.conf:ro
    depends_on:
      dns:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket, urllib.request, dns.resolver;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read();
          r=dns.resolver.Resolver(configure=False);
          r.nameservers=[socket.gethostbyname('dns')]; r.port=1053;
          assert '192.0.2.10' in {a.to_text() for a in r.resolve('automx.example.net','A')}
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  probe:
    image: automx:e2e
    depends_on:
      automx:
        condition: service_healthy
    entrypoint:
      - automx
    command:
      - probe
      - all
      - --base-url
      - http://automx:8000
      - --email
      - user@example.test
      - --allow-insecure-http
      - --include-experimental
      - --config
      - /etc/automx/automx.conf
      - --domain
      - example.test
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./automx.conf:/etc/automx/automx.conf:ro
