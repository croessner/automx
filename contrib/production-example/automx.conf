[automx]
provider = example.test
domains = example.test example-mail.test
autodiscover_v2 = no

[DEFAULT]
account_name = Example Mail
account_name_short = Example

[global]
backend = static

imap = yes
imap_server = imap.example.test
imap_port = 993
imap_encryption = ssl
imap_auth = oauth2, plaintext

smtp = yes
smtp_server = smtp.example.test
smtp_port = 465
smtp_encryption = ssl
smtp_auth = oauth2, plaintext
smtp_default = yes

oauth_issuer = https://login.example.test
oauth_auth_url = https://login.example.test/oidc/authorize
oauth_token_url = https://login.example.test/oidc/token
oauth_scope = openid offline_access mail:account:read
