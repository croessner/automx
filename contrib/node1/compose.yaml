services:
  automx:
    image: ${AUTOMX_IMAGE:?Set AUTOMX_IMAGE to an immutable registry digest}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: "1.0"
    stop_grace_period: 15s
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      AUTOMX_CONFIG: /etc/automx/automx.conf
    volumes:
      - ./automx.conf:/etc/automx/automx.conf:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - rnsweb
    labels:
      traefik.enable: "true"
      traefik.docker.network: rnsweb
      traefik.http.services.automx.loadbalancer.server.port: "8000"

      traefik.http.routers.automx-autoconfig.entrypoints: websecure
      traefik.http.routers.automx-autoconfig.rule: >-
        Host(`autoconfig.itsi.be`) ||
        Host(`autoconfig.dsgvo-europa.de`) ||
        Host(`autoconfig.ra-roessner-merle.de`) ||
        Host(`autoconfig.iladresse.de`) ||
        Host(`autoconfig.emailforschung.de`) ||
        Host(`autoconfig.dsb-in-hessen.de`) ||
        Host(`autoconfig.alltagswahnsinn.de`) ||
        Host(`autoconfig.dsb-roessner.de`) ||
        Host(`autoconfig.christianroessner.de`) ||
        Host(`autoconfig.exampleserver.de`) ||
        Host(`autoconfig.nicoleschuldt.de`) ||
        Host(`autoconfig.roessner-net.de`) ||
        Host(`autoconfig.roessner.blog`) ||
        Host(`autoconfig.nauthilus.org`) ||
        Host(`autoconfig.mlserv.org`) ||
        Host(`autoconfig.alsfeld.email`) ||
        Host(`autoconfig.roessner.email`) ||
        Host(`autoconfig.roessner-network-solutions.com`) ||
        Host(`autoconfig.nauthilus.com`) ||
        Host(`autoconfig.roessner-net.com`) ||
        Host(`autoconfig.roessner.co`) ||
        Host(`autoconfig.mymail.zip`) ||
        Host(`autoconfig.roessner.services`) ||
        Host(`autoconfig.nauthilus.net`) ||
        Host(`autoconfig.srvint.net`) ||
        Host(`autoconfig.roessner.support`)
      traefik.http.routers.automx-autoconfig.service: automx
      traefik.http.routers.automx-autoconfig.tls: "true"
      traefik.http.routers.automx-autoconfig.tls.certresolver: myresolver

      traefik.http.routers.automx-autodiscover.entrypoints: websecure
      traefik.http.routers.automx-autodiscover.rule: >-
        Host(`autodiscover.itsi.be`) ||
        Host(`autodiscover.dsgvo-europa.de`) ||
        Host(`autodiscover.ra-roessner-merle.de`) ||
        Host(`autodiscover.iladresse.de`) ||
        Host(`autodiscover.emailforschung.de`) ||
        Host(`autodiscover.dsb-in-hessen.de`) ||
        Host(`autodiscover.alltagswahnsinn.de`) ||
        Host(`autodiscover.dsb-roessner.de`) ||
        Host(`autodiscover.christianroessner.de`) ||
        Host(`autodiscover.exampleserver.de`) ||
        Host(`autodiscover.nicoleschuldt.de`) ||
        Host(`autodiscover.roessner-net.de`) ||
        Host(`autodiscover.roessner.blog`) ||
        Host(`autodiscover.nauthilus.org`) ||
        Host(`autodiscover.mlserv.org`) ||
        Host(`autodiscover.alsfeld.email`) ||
        Host(`autodiscover.roessner.email`) ||
        Host(`autodiscover.roessner-network-solutions.com`) ||
        Host(`autodiscover.nauthilus.com`) ||
        Host(`autodiscover.roessner-net.com`) ||
        Host(`autodiscover.roessner.co`) ||
        Host(`autodiscover.mymail.zip`) ||
        Host(`autodiscover.roessner.services`) ||
        Host(`autodiscover.nauthilus.net`) ||
        Host(`autodiscover.srvint.net`) ||
        Host(`autodiscover.roessner.support`)
      traefik.http.routers.automx-autodiscover.service: automx
      traefik.http.routers.automx-autodiscover.tls: "true"
      traefik.http.routers.automx-autodiscover.tls.certresolver: myresolver

      traefik.http.routers.automx-pacc.entrypoints: websecure
      traefik.http.routers.automx-pacc.rule: >-
        Host(`ua-auto-config.itsi.be`) ||
        Host(`ua-auto-config.dsgvo-europa.de`) ||
        Host(`ua-auto-config.ra-roessner-merle.de`) ||
        Host(`ua-auto-config.iladresse.de`) ||
        Host(`ua-auto-config.emailforschung.de`) ||
        Host(`ua-auto-config.dsb-in-hessen.de`) ||
        Host(`ua-auto-config.alltagswahnsinn.de`) ||
        Host(`ua-auto-config.dsb-roessner.de`) ||
        Host(`ua-auto-config.christianroessner.de`) ||
        Host(`ua-auto-config.exampleserver.de`) ||
        Host(`ua-auto-config.nicoleschuldt.de`) ||
        Host(`ua-auto-config.roessner-net.de`) ||
        Host(`ua-auto-config.roessner.blog`) ||
        Host(`ua-auto-config.nauthilus.org`) ||
        Host(`ua-auto-config.mlserv.org`) ||
        Host(`ua-auto-config.alsfeld.email`) ||
        Host(`ua-auto-config.roessner.email`) ||
        Host(`ua-auto-config.roessner-network-solutions.com`) ||
        Host(`ua-auto-config.nauthilus.com`) ||
